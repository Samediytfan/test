services:
  - type: web
    name: relay-discord-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: VAULT_PASSWORD
        generateValue: true
